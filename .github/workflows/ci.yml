# The same checks as scripts/check.sh, on every push and pull request to main and dev.
# No secrets: the test suite uses a dummy key and never makes a paid model call.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Style and docstrings (ruff)
        run: ruff check .
      - name: Tests with the 85% coverage gate
        run: scripts/test.sh
      - name: API reference is up to date
        run: scripts/build_api_docs.sh --check
